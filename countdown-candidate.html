    setTimeout(scheduleShootingStar, rand(SHOOTING_STAR_EVERY[0], SHOOTING_STAR_EVERY[1]) * 1000);
  }
  if (SHOOTING_STARS && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setTimeout(scheduleShootingStar, 1000);   // first star 1s after the page opens
  }

  // ===========================================================================
  // SEASONS
  // Works out how much of each season is showing, and from that how strong
  // each seasonal effect should be right now.
  // ===========================================================================
  const SEASON_NAMES = ["spring", "summer", "autumn", "winter"];
  const SEASON_KEYS = ["petals", "leaves", "snow", "fireflies", "aurora", "mist", "lanterns", "crickets", "wind"];
  const seasonStart = performance.now();

  // Share of each season showing right now (they add up to 1). In "cycle"
  // mode, two seasons overlap while one blends into the next.
  function seasonWeights(now) {
    const w = { spring: 0, summer: 0, autumn: 0, winter: 0 };
    if (seasonMode === "calendar") {
      const month = new Date().getMonth();           // 0 = January
      const north = ["winter", "winter", "spring", "spring", "spring", "summer",
                     "summer", "summer", "autumn", "autumn", "autumn", "winter"][month];
      const opposite = { spring: "autumn", summer: "winter", autumn: "spring", winter: "summer" };
      w[HEMISPHERE === "south" ? opposite[north] : north] = 1;
    } else if (seasonMode === "cycle") {
      const first = Math.max(0, SEASON_NAMES.indexOf(seasonFixed));
      const elapsed = (now - seasonStart) / 1000;
      const n = Math.floor(elapsed / SEASON_SECONDS);      // seasons completed so far
      const into = elapsed - n * SEASON_SECONDS;           // seconds into this season
      const current = SEASON_NAMES[(first + n) % 4];
      const next = SEASON_NAMES[(first + n + 1) % 4];
      const blend = clamp((into - (SEASON_SECONDS - SEASON_BLEND_SECONDS)) / SEASON_BLEND_SECONDS, 0, 1);
      const smooth = blend * blend * (3 - 2 * blend);      // ease in and out
      w[current] += 1 - smooth;
      w[next] += smooth;
    } else {
      w[SEASON_NAMES.includes(seasonFixed) ? seasonFixed : "autumn"] = 1;
    }
    return w;
  }

  // Strength of every effect in SEASONS right now, e.g. season().snow.
  let seasonCache = { t: -1e9, a: null };
  function season(now = performance.now()) {
    if (seasonCache.a && Math.abs(now - seasonCache.t) < 30) return seasonCache.a;
    const w = seasonWeights(now);
    const a = { weights: w };
    for (const key of SEASON_KEYS) {
      a[key] = SEASON_NAMES.reduce((sum, s) => sum + w[s] * ((SEASONS[s] || {})[key] || 0), 0);
    }
    seasonCache = { t: now, a };
    return a;
  }

  // ===========================================================================
  // MIST, LANTERNS AND FALLING LEAVES / SNOW / PETALS  (the #fx canvas)
  // This loop also eases the parallax and fades the fireflies with the season.
  // ===========================================================================
  const fx = document.getElementById("fx");
  const xctx = fx.getContext("2d");
  const firefliesLayer = document.getElementById("fireflies");
  let weather = [], lanterns = [], mists = [];
  let parX = 0, parY = 0, parTargetX = 0, parTargetY = 0;   // parallax, -1 .. 1

  // Where the water starts (or near the bottom when there is no water).
  const waterLine = () => innerHeight * (1 - (SHOW_WATER ? WATER_HEIGHT : 0.12));
  // Makes things a bit smaller on phones and a bit bigger on large screens.
  const sizeScale = () => clamp(Math.min(innerWidth, innerHeight) / 800, 0.6, 1.3);

  // Sizes a canvas to the window, sharp on high-resolution screens.
  function sizeCanvas(c, ctx) {
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // --- Mist: long soft ovals drifting slowly to the right along the water ---
  function makeMist(anywhere) {
    const k = sizeScale(), rx = rand(180, 380) * k;
    return {
      x: anywhere ? rand(-rx, innerWidth + rx) : -rx,
      y: rand(waterLine() - innerHeight * 0.05, innerHeight),
      rx, ry: rand(18, 42) * k,
      speed: rand(6, 16),                            // pixels per second
      strength: rand(0.5, 1)
    };
  }
  function drawMist(dt, amount) {
    if (amount < 0.01) return;
    for (const m of mists) {
      m.x += m.speed * dt;
      if (m.x - m.rx > innerWidth) Object.assign(m, makeMist(false));
      xctx.save();
      xctx.translate(m.x, m.y);
      xctx.scale(m.rx / m.ry, 1);                    // stretch a circle into a long oval
      const g = xctx.createRadialGradient(0, 0, 0, 0, 0, m.ry);
      g.addColorStop(0, `rgba(${colors.mist}, ${(0.18 * amount * m.strength).toFixed(3)})`);
      g.addColorStop(1, `rgba(${colors.mist}, 0)`);
      xctx.fillStyle = g;
      xctx.fillRect(-m.ry, -m.ry, m.ry * 2, m.ry * 2);
      xctx.restore();
    }
  }

  // --- Lanterns: launched from the water, rising and swaying, fading high up ---
  function updateLanterns(dt, amount) {
    const mean = (LANTERN_EVERY[0] + LANTERN_EVERY[1]) / 2;
    if (lanterns.length < 14 && Math.random() < dt * amount / mean) {
      const k = sizeScale(), w = rand(9, 15) * k, x = rand(0.05, 0.95) * innerWidth;
      lanterns.push({
        x0: x, x, y: waterLine() + rand(0, innerHeight - waterLine()) * 0.5,
        w, h: w * 1.3, vy: -rand(14, 26) * k, sway: rand(6, 16), phase: rand(0, 6.3), t: 0
      });
    }
    const glowMode = isDark() ? "lighter" : "source-over";
    for (const L of lanterns) {
      L.t += dt;
      L.y += L.vy * dt;
      L.x = L.x0 + Math.sin(L.t * 0.8 + L.phase) * L.sway;
      // fade in when launched; fade out as it nears the top of the sky
      const a = Math.min(1, L.t / 1.5) * clamp(L.y / (innerHeight * 0.35), 0, 1);
      if (a <= 0) continue;
      // warm glow around it
      xctx.globalCompositeOperation = glowMode;
      const g = xctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.w * 3);
      g.addColorStop(0, `rgba(${colors.lantern}, ${(0.4 * a).toFixed(3)})`);
      g.addColorStop(1, `rgba(${colors.lantern}, 0)`);
      xctx.fillStyle = g;
      xctx.fillRect(L.x - L.w * 3, L.y - L.w * 3, L.w * 6, L.w * 6);
      xctx.globalCompositeOperation = "source-over";
      // paper body: brightest at the bottom, where the flame is
      const body = xctx.createLinearGradient(0, L.y - L.h / 2, 0, L.y + L.h / 2);
      body.addColorStop(0, `rgba(${colors.lantern}, ${(0.55 * a).toFixed(3)})`);
      body.addColorStop(1, `rgba(255, 236, 190, ${(0.95 * a).toFixed(3)})`);
      xctx.fillStyle = body;
      xctx.beginPath();
      if (xctx.roundRect) xctx.roundRect(L.x - L.w / 2, L.y - L.h / 2, L.w, L.h, L.w * 0.3);
      else xctx.rect(L.x - L.w / 2, L.y - L.h / 2, L.w, L.h);
      xctx.fill();
    }
    lanterns = lanterns.filter(L => L.y > -40);
  }

  // --- Falling leaves, snowflakes and petals ---
  // How many start falling each second at full season strength, on a
  // 1280px-wide screen (narrower screens get proportionally fewer).
  const WEATHER_RATE = { leaves: 2.2, snow: 14, petals: 3 };

  function spawnWeather(type) {
    const k = sizeScale();
    const p = { type, x0: rand(-0.1, 1.1) * innerWidth, y: -20, t: 0, phase: rand(0, 6.3), rot: rand(0, 6.3) };
    if (type === "leaves") Object.assign(p, {
      size: rand(9, 15) * k, vy: rand(30, 60) * k, vx: rand(5, 30),        // falls, drifts right
      sway: rand(15, 35), swaySpeed: rand(0.8, 1.6), spin: rand(-1.5, 1.5), flipSpeed: rand(1.5, 3.5),
      color: pick(LEAF_COLORS) });
    if (type === "petals") Object.assign(p, {
      size: rand(4, 7) * k, vy: rand(18, 38) * k, vx: rand(5, 25),
      sway: rand(10, 25), swaySpeed: rand(0.8, 1.8), spin: rand(-2, 2), flipSpeed: rand(2, 4),
      color: pick(PETAL_COLORS) });
    if (type === "snow") Object.assign(p, {
      size: rand(1, 3.2) * k, vy: rand(30, 65) * k, vx: rand(-5, 10),
      sway: rand(5, 15), swaySpeed: rand(0.5, 1.2), alpha: rand(0.55, 0.95) });
    weather.push(p);
    return p;
  }

  // Fills the screen with already-falling pieces, so the page doesn't open
  // with an empty sky while the first ones fall from the top.
  function prefillWeather() {
    const S = season(), widthScale = innerWidth / 1280;
    const crossing = { leaves: 45, snow: 48, petals: 28 };   // typical fall speed, px/s
    for (const type of ["leaves", "snow", "petals"]) {
      const n = WEATHER_RATE[type] * S[type] * WEATHER_AMOUNT * widthScale * innerHeight / (crossing[type] * sizeScale());
      for (let i = 0; i < n && weather.length < 500; i++) {
        const p = spawnWeather(type);
        p.y = rand(-20, innerHeight);
        p.t = rand(0, 10);
      }
    }
  }

  function updateWeather(dt, S) {
    const widthScale = innerWidth / 1280;
    for (const type of ["leaves", "snow", "petals"]) {
      let expected = WEATHER_RATE[type] * S[type] * WEATHER_AMOUNT * widthScale * dt;
      while (weather.length < 500 && Math.random() < expected) { spawnWeather(type); expected -= 1; }
    }
    for (const p of weather) {
      p.t += dt;
      p.y += p.vy * dt;
      p.x0 += p.vx * dt;
      const x = p.x0 + Math.sin(p.t * p.swaySpeed + p.phase) * p.sway;   // side-to-side sway
      if (p.type === "snow") {
        xctx.fillStyle = `rgba(${colors.snow}, ${p.alpha})`;
        xctx.beginPath(); xctx.arc(x, p.y, p.size, 0, 2 * Math.PI); xctx.fill();
        continue;
      }
      // leaves and petals spin, and squash sideways as if tumbling over
      p.rot += p.spin * dt;
      const flip = Math.cos(p.t * p.flipSpeed + p.phase);
      xctx.save();
      xctx.translate(x, p.y);
      xctx.rotate(p.rot);
      xctx.scale(Math.abs(flip) < 0.15 ? 0.15 : Math.abs(flip), 1);
      xctx.globalAlpha = 0.9;
      xctx.fillStyle = p.color;
      xctx.beginPath();
      if (p.type === "leaves") {
        const s = p.size;                            // pointed leaf...
        xctx.moveTo(0, -s);
        xctx.quadraticCurveTo(s * 0.75, -s * 0.2, 0, s);
        xctx.quadraticCurveTo(-s * 0.75, -s * 0.2, 0, -s);
        xctx.fill();
        xctx.strokeStyle = "rgba(60, 30, 10, .45)"; // ...with a stem down the middle
        xctx.lineWidth = 1;
        xctx.beginPath(); xctx.moveTo(0, -s * 0.8); xctx.lineTo(0, s * 1.25); xctx.stroke();
      } else {
        xctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, 2 * Math.PI);   // petal
        xctx.fill();
      }
      xctx.restore();
    }
    weather = weather.filter(p => p.y < innerHeight + 30 && p.x0 > -200 && p.x0 < innerWidth + 200);
  }

  let fxLast = performance.now();
  function fxFrame(now) {
    const dt = Math.min((now - fxLast) / 1000, 0.1);
    fxLast = now;
    const S = season(now);
    // Parallax: ease toward where the mouse (or phone tilt) points.
    parX += (parTargetX - parX) * Math.min(1, dt * 2.5);
    parY += (parTargetY - parY) * Math.min(1, dt * 2.5);
    root.style.setProperty("--px", (parX * PARALLAX_STRENGTH).toFixed(3));
    root.style.setProperty("--py", (parY * PARALLAX_STRENGTH).toFixed(3));
    // Fireflies come and go with the season.
    firefliesLayer.style.opacity = Math.min(1, S.fireflies).toFixed(3);
    xctx.clearRect(0, 0, innerWidth, innerHeight);
    if (SHOW_MIST) drawMist(dt, S.mist);
    if (SHOW_LANTERNS) updateLanterns(dt, S.lanterns);
    if (SHOW_WEATHER) updateWeather(dt, S);
    requestAnimationFrame(fxFrame);
  }

  function resetFx() {
    sizeCanvas(fx, xctx);
    mists = Array.from({ length: 7 }, () => makeMist(true));
    if (!motionOK && SHOW_MIST) drawMist(0, season().mist);   // still mist, nothing moving
  }
  resetFx();
  addEventListener("resize", resetFx);
  if (motionOK) {
    if (SHOW_WEATHER) prefillWeather();
    requestAnimationFrame(fxFrame);
  }

  // ===========================================================================
  // FIREWORKS, STAR BURSTS AND POINTER SPARKLES  (the #front canvas, in front
  // of everything). This loop only runs while something is showing.
  // ===========================================================================
  const front = document.getElementById("front");
  const fctx = front.getContext("2d");
  let sparks = [], rockets = [], fireworksUntil = 0, frontRunning = false, frontLast = 0;
  sizeCanvas(front, fctx);
  addEventListener("resize", () => sizeCanvas(front, fctx));

  // One glowing spark. star = draw it as a 4-point star instead of a dot.
  function addSpark(x, y, vx, vy, color, life, size, gravity, star) {
    sparks.push({ x, y, vx, vy, color, life, max: life, size, gravity, star });
    wakeFront();
  }
  // Many sparks flying out in all directions from one point.
  function burst(x, y, count, palette, speed = [60, 260], stars = false) {
    for (let i = 0; i < count; i++) {
      const angle = rand(0, 2 * Math.PI), v = rand(speed[0], speed[1]);
      addSpark(x, y, Math.cos(angle) * v, Math.sin(angle) * v, pick(palette),
               rand(1.2, 2.2), rand(1.6, 3), 70, stars && Math.random() < 0.4);
    }
  }
  // A firework rocket: climbs from the bottom, then bursts.
  function launchRocket() {
    rockets.push({
      x: rand(0.15, 0.85) * innerWidth, y: innerHeight, vx: rand(-40, 40),
      vy: -rand(430, 580) * Math.sqrt(innerHeight / 800),
      top: rand(0.12, 0.45) * innerHeight,           // where it bursts
      color: pick(FIREWORK_COLORS)
    });
    wakeFront();
  }
  function startFireworks(seconds) { fireworksUntil = performance.now() + seconds * 1000; wakeFront(); }

  function wakeFront() {
    if (frontRunning) return;
    frontRunning = true;
    frontLast = performance.now();
    requestAnimationFrame(frontFrame);
  }
  function drawStarShape(ctx, x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y);
    ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.fill();
  }
  function frontFrame(now) {
    const dt = Math.min((now - frontLast) / 1000, 0.05);
    frontLast = now;
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    if (now < fireworksUntil && Math.random() < dt * 1.8) launchRocket();   // ~2 a second
    fctx.globalCompositeOperation = isDark() ? "lighter" : "source-over";
    for (const r of rockets) {
      r.x += r.vx * dt; r.y += r.vy * dt; r.vy += 120 * dt;          // slows as it climbs
      sparks.push({ x: r.x, y: r.y, vx: rand(-15, 15), vy: rand(20, 60), color: r.color,
                    life: 0.4, max: 0.4, size: 1.2, gravity: 0, star: false });   // its trail
      if (r.y <= r.top || r.vy >= -40) {
        burst(r.x, r.y, 110, [r.color, r.color, "#ffffff"], [60, 380]);
        r.done = true;
      }
    }
    rockets = rockets.filter(r => !r.done);
    const drag = Math.pow(0.4, dt);                  // sparks slow down as they spread
    for (const s of sparks) {
      s.life -= dt;
      s.vx *= drag;
      s.vy = s.vy * drag + s.gravity * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      const a = Math.max(0, s.life / s.max);         // fades out over its life
      fctx.globalAlpha = a;
      fctx.fillStyle = s.color;
      if (s.star) drawStarShape(fctx, s.x, s.y, s.size * 2.5);
      else { fctx.beginPath(); fctx.arc(s.x, s.y, s.size * (0.5 + 0.5 * a), 0, 2 * Math.PI); fctx.fill(); }
    }
    fctx.globalAlpha = 1;
    fctx.globalCompositeOperation = "source-over";
    sparks = sparks.filter(s => s.life > 0);
    if (sparks.length || rockets.length || now < fireworksUntil) requestAnimationFrame(frontFrame);
    else { frontRunning = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ===========================================================================
  // THE COUNTDOWN ITSELF: milestones, last 10 seconds, progress ring
  // ===========================================================================
  const clockEl = document.getElementById("clock");

  // A message in a small pill at the top of the page (fades after 4.5s).
  function showBanner(text) {
    const el = document.createElement("div");
    el.className = "milestone";
    el.setAttribute("role", "status");
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4600);
  }
  // A milestone: the message, plus a burst of stars flying out of the clock.
  function celebrate(text) {
    showBanner(text);
    if (!motionOK) return;
    const r = clockEl.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 150, FIREWORK_COLORS.concat("#ffffff"), [80, 420], true);
  }
  // Last ten seconds: the clock grows, and pulses once every second.
  function finalSecond(secondsLeft) {
    const on = FINAL_COUNTDOWN && secondsLeft <= 10;
    document.body.classList.toggle("final", on);
    if (!on) return;
    clockEl.classList.remove("pulse");
    void clockEl.offsetWidth;                        // restarts the pulse animation
    clockEl.classList.add("pulse");
  }
  // Progress ring: how far along we are from PROGRESS_START to the end.
  const ringFill = document.getElementById("ring-fill");
  const progressStart = new Date(PROGRESS_START);
  function updateRing() {
    if (!ringFill || !ringFill.isConnected) return;
    const pct = clamp((Date.now() - progressStart) / (target - progressStart), 0, 1);
    ringFill.style.strokeDashoffset = (100 - pct * 100).toFixed(2);   // 100 = empty, 0 = full
  }
  if (!SHOW_PROGRESS_RING) document.getElementById("moon-ring").remove();

  // ===========================================================================
  // INTERACTIVE: pointer sparkles, tap for a shooting star, parallax
  // ===========================================================================
  let lastTrail = { x: -99, y: -99 };
  addEventListener("pointermove", e => {
    if (PARALLAX && motionOK && e.pointerType === "mouse") {
      parTargetX = (e.clientX / innerWidth - 0.5) * 2;    // -1 (left) .. 1 (right)
      parTargetY = (e.clientY / innerHeight - 0.5) * 2;   // -1 (top)  .. 1 (bottom)
    }
    // a sparkle every 8 pixels or so along the pointer's path
    if (POINTER_TRAIL && motionOK && Math.hypot(e.clientX - lastTrail.x, e.clientY - lastTrail.y) > 8) {
      lastTrail = { x: e.clientX, y: e.clientY };
      addSpark(e.clientX, e.clientY, rand(-20, 20), rand(-30, 10),
               pick([colors.twinkle, colors.title2, "#ffffff"]), rand(0.5, 0.9), rand(1, 2.2), 40, Math.random() < 0.35);
    }
  }, { passive: true });
  root.addEventListener("mouseleave", () => { parTargetX = parTargetY = 0; });

  addEventListener("pointerdown", e => {
    if (e.target.closest && e.target.closest("button")) return;   // not the speaker button
    if (!motionOK) return;
    if (POINTER_TRAIL) burst(e.clientX, e.clientY, 12, [colors.twinkle, colors.title2, "#ffffff"], [30, 120], true);
    if (CLICK_SHOOTING_STAR) shootStar(e.clientX, e.clientY);
  });

  if (PARALLAX && motionOK) {
    addEventListener("deviceorientation", e => {
      if (e.gamma == null) return;
      parTargetX = clamp(e.gamma / 30, -1, 1);            // tilting left / right
      parTargetY = clamp((e.beta - 45) / 30, -1, 1);      // tilting toward / away (held at ~45°)
    });
    // iPhones and iPads ask permission before sharing tilt: ask on the first tap.
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      addEventListener("pointerdown", () => DeviceOrientationEvent.requestPermission().catch(() => {}), { once: true });
    }
  }

  // ===========================================================================
  // NIGHT SOUNDS: crickets and wind, made in the browser (no sound files).
  // Nothing plays until the viewer presses the speaker button.
  // ===========================================================================
  const soundBtn = document.getElementById("sound-btn");
  const SPEAKER = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
                  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/>';
  const ICON_ON  = SPEAKER + '<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = SPEAKER + '<path d="m16 9 5 6M21 9l-5 6"/></svg>';
  let audioCtx = null, master = null;

  function setSoundButton(on) {
    soundBtn.innerHTML = on ? ICON_ON : ICON_OFF;
    soundBtn.setAttribute("aria-pressed", String(on));
    soundBtn.setAttribute("aria-label", on ? "Turn off night sounds" : "Turn on night sounds");
  }

  function startSound() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = SOUND_VOLUME;
    master.connect(audioCtx.destination);

    // Wind: two seconds of soft rumbling noise, looped, through a filter whose
    // loudness and brightness drift up and down like gusts.
    const len = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * rand(-1, 1)) / 1.02; data[i] = last * 3.5; }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    const windFilter = audioCtx.createBiquadFilter();
    windFilter.type = "lowpass";
    windFilter.frequency.value = 400;
    const windGain = audioCtx.createGain();
    windGain.gain.value = 0;
    noise.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(master);
    noise.start();
    (function gust() {
      const S = season(), t = audioCtx.currentTime;
      windGain.gain.setTargetAtTime((0.05 + 0.4 * S.wind) * rand(0.5, 1), t, 1.5);
      windFilter.frequency.setTargetAtTime(rand(250, 600 + 600 * S.wind), t, 2);
      setTimeout(gust, rand(2500, 5000));
    })();

    // Crickets: every so often (more in summer), a cricket chirps.
    (function crickets() {
      if (audioCtx.state === "running" && Math.random() < season().crickets) chirp();
      setTimeout(crickets, rand(250, 900));
    })();
  }

  // One chirp: 2-4 very short high beeps, from a random spot left to right.
  function chirp() {
    const t0 = audioCtx.currentTime + 0.02;
    const osc = audioCtx.createOscillator();
    osc.frequency.value = rand(4200, 5000);          // this cricket's pitch
    const g = audioCtx.createGain();
    g.gain.value = 0;
    osc.connect(g);
    if (audioCtx.createStereoPanner) {
      const pan = audioCtx.createStereoPanner();
      pan.pan.value = rand(-0.8, 0.8);
      g.connect(pan);
      pan.connect(master);
    } else {
      g.connect(master);
    }
    const pulses = Math.floor(rand(2, 5)), vol = rand(0.015, 0.04);
    for (let p = 0; p < pulses; p++) {
      const s = t0 + p * 0.045;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(vol, s + 0.008);
      g.gain.linearRampToValueAtTime(0, s + 0.03);
    }
    osc.start(t0);
    osc.stop(t0 + pulses * 0.045 + 0.05);
  }

  if (SOUND_BUTTON) {
    soundBtn.hidden = false;
    setSoundButton(false);
    soundBtn.addEventListener("click", () => {
      if (!audioCtx) { startSound(); setSoundButton(true); return; }
      if (audioCtx.state === "running") { audioCtx.suspend(); setSoundButton(false); }
      else { audioCtx.resume(); setSoundButton(true); }
    });
  } else {
    soundBtn.remove();
  }


  // --- Confetti ---------------------------------------------------------------
  // Draws falling paper pieces on the full-screen canvas. Skipped for viewers
  // who turned on "reduce motion".
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.getElementById("confetti");
    const ctx = c.getContext("2d");
    // sized to the screen's real pixel density so the pieces stay sharp
    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      c.width = innerWidth * dpr; c.height = innerHeight * dpr;
      c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize(); addEventListener("resize", resize);
    // 180 = number of pieces. Each gets a random position, size, speed and spin.
    const bits = Array.from({ length: 180 }, () => ({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,       // size (px)
      vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,    // fall / drift speed
      r: Math.random() * Math.PI, vr: -.1 + Math.random() * .2, // rotation / spin
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]
    }));
    const start = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      // For CONFETTI_SECONDS, pieces that fall off the bottom restart at the
      // top; after that they fall away and the animation stops by itself.
      const recycle = t - start < CONFETTI_SECONDS * 1000;
      let alive = 0;
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y > innerHeight + 20 && recycle) { b.y = -20; b.x = Math.random() * innerWidth; }
        if (b.y <= innerHeight + 20) alive++;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.fillStyle = b.color; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      if (alive) requestAnimationFrame(frame);
    })(start);
  }

  // ===========================================================================
  // START
  // ===========================================================================
  schedule();                                        // start the countdown
  if (PREVIEW === "milestone") setTimeout(() => celebrate("One week to go!"), 1200);
  addEventListener("hashchange", () => location.reload());   // switching previews
</script>
</body>
</html>
