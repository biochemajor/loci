[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loci"
version = "0.1.0"
description = "Track public holidays for a list of countries and export them as an iCalendar (.ics) file."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["holidays>=0.50"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
loci = "loci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
